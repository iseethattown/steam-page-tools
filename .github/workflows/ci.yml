name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit development dependencies
        run: npm audit --audit-level=high

      - name: Lint, validate, and verify reproducible packages
        run: npm run check

      - name: Confirm expected archives
        run: |
          test -f dist/steam-page-tools-chrome-v1.1.0.zip
          test -f dist/steam-page-tools-firefox-v1.1.0.zip

      - name: Confirm build did not modify tracked source
        run: git diff --exit-code
